
name: Free-Windows-RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rdp:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Enable Secure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Start-Service TermService

      - name: Install Tailscale
        shell: powershell
        run: |
          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $exe)) {
            $msi = "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
              -OutFile $msi

            $p = Start-Process msiexec.exe `
              -ArgumentList "/i `"$msi`" /quiet /norestart" `
              -Wait -PassThru

            if ($p.ExitCode -ne 0) {
              throw "Tailscale installation failed: $($p.ExitCode)"
            }

            Remove-Item $msi -Force
          }

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TS_AUTHKEY secret is missing"
          }

          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $exe up --authkey="$env:TS_AUTHKEY" --hostname=windows-rdp

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed"
          }

          Start-Sleep -Seconds 5

          $ip = & $exe ip -4

          Write-Host "Tailscale IP: $ip"
          Write-Host "RDP Port: 3389"
          Write-Host "Use your existing Windows account."

      - name: Verify RDP
        shell: powershell
        run: |
          Get-Service TermService
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' |
            Select-Object DisplayName, Enabled
          Write-Host "Setup completed"
